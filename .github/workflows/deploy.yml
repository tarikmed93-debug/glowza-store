name: Deploy Glowza

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via rsync SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST:     ${{ secrets.SSH_HOST }}
          REMOTE_USER:     ${{ secrets.SSH_USER }}
          REMOTE_PORT:     ${{ secrets.SSH_PORT || '22' }}
          SOURCE:          "theme/child/ mu-plugins/ plugins/"
          TARGET:          ${{ secrets.REMOTE_PATH }}
          EXCLUDE:         ".git/, node_modules/, tests/"

      - name: Activer plugins et flush (WP-CLI via SSH)
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.WP_PATH }}
            wp plugin activate pixel-manager dsers-ready glowza-tweaks --allow-root
            wp rewrite flush --allow-root
            wp cache flush --allow-root
            echo "✅ Déploiement OK — $(date)"

  test:
    name: Tests Playwright (post-deploy)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: tests/playwright
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: tests/playwright
        env:
          TEST_URL:        ${{ secrets.SITE_URL }}
          WEBHOOK_SECRET:  ${{ secrets.WEBHOOK_SECRET }}
        run: npx playwright test --project="Mobile Chrome (principal)"

      - name: Upload rapport test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          retention-days: 7
